<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>20 desember 2009</title>
<style>
body {
  background:#0077ff;
  color:#fff;
  font-family:sans-serif;
  margin:0;
  padding:0;
  overflow-x:hidden; /* biar ga geser ke samping */
}
.slide {
  display:none;
  padding:40px 20px;
  min-height:100vh;
  box-sizing:border-box;
  text-align:center;
}
.slide.aktif {
  display:block;
  animation:masukMiring 0.9s ease;
}
@keyframes masukMiring {
  from {transform: translateX(100%) rotate(8deg); opacity:0}
  to {transform: translateX(0) rotate(0deg); opacity:1}
}
.container {
  max-width:400px;
  margin:0 auto; /* biar tulisannya di tengah dan rapi */
  text-align:left;
}
img {
  width:90%;
  max-width:320px;
  border-radius:15px;
  margin:15px auto; 
  display:block;
  box-shadow:0 5px 20px rgba(0,0,0,0.3)
}
button {
  background:#fff;
  color:#0077ff;
  border:none;
  padding:15px 40px;
  border-radius:30px;
  font-size:20px;
  margin:30px auto;
  font-weight:bold;
  display:block;
  cursor:pointer;
}
h1 {font-size:26px; text-align:center; margin-bottom:20px}
p {font-size:17px; line-height:1.9}
audio {display:none}
</style>
</head>
